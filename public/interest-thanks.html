<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#fff4f7" />
<title>You're on the list — Lost on the BeltLine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Outfit:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root{
    --ground:#fff4f7; --glow-1:#ffd0bd; --glow-2:#ffc0dc; --glow-3:#c9f0e0; --glow-4:#d8ccff;
    --ink:#2b1b3d; --ink-soft:#6d5b80; --ink-faint:#9b8bab;
    --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.9);
    --glass-shadow:0 18px 40px -22px rgba(74,38,92,.55);
    --pop:#e0457b; --line:rgba(120,86,145,.16);
    --font-display:Syne,ui-sans-serif,system-ui,sans-serif;
    --font-body:Outfit,ui-sans-serif,system-ui,-apple-system,sans-serif;
    --font-data:'DM Mono',ui-monospace,Menlo,monospace;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme='light']){
      --ground:#120a1b; --glow-1:#4a1f56; --glow-2:#6d1f48; --glow-3:#0d4a52; --glow-4:#2d1f66;
      --ink:#f6edff; --ink-soft:#bcaad0; --ink-faint:#8a7a9e;
      --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --glass-edge:rgba(255,255,255,.16);
      --glass-shadow:0 18px 44px -20px rgba(0,0,0,.8);
      --pop:#ff6fa5; --line:rgba(255,255,255,.12);
      color-scheme:dark;
    }
  }
  :root[data-theme='dark']{
    --ground:#120a1b; --glow-1:#4a1f56; --glow-2:#6d1f48; --glow-3:#0d4a52; --glow-4:#2d1f66;
    --ink:#f6edff; --ink-soft:#bcaad0; --ink-faint:#8a7a9e;
    --glass:rgba(255,255,255,.07); --glass-strong:rgba(255,255,255,.12); --glass-edge:rgba(255,255,255,.16);
    --glass-shadow:0 18px 44px -20px rgba(0,0,0,.8);
    --pop:#ff6fa5; --line:rgba(255,255,255,.12);
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  html{background-color:var(--ground)}
  /* Fixed layer, not background-attachment:fixed — iOS Safari mishandles that. */
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;
    background-color:var(--ground);
    background-image:
      radial-gradient(at 8% 4%,var(--glow-1) 0,transparent 52%),
      radial-gradient(at 92% 10%,var(--glow-2) 0,transparent 48%),
      radial-gradient(at 72% 88%,var(--glow-3) 0,transparent 50%),
      radial-gradient(at 14% 78%,var(--glow-4) 0,transparent 48%);
  }
  body{
    min-height:100vh;color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;
    -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
    display:grid;place-items:center;
  }
  main{max-width:520px;padding-inline:18px;padding-block:56px}
  .doc{
    position:relative;overflow:hidden;text-align:center;padding:38px 26px 26px;
    background:var(--glass);
    -webkit-backdrop-filter:blur(18px) saturate(140%);backdrop-filter:blur(18px) saturate(140%);
    border:1px solid var(--glass-edge);border-radius:22px;box-shadow:var(--glass-shadow);
  }
  .doc::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(128deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,0) 42%);
    mix-blend-mode:overlay;
  }
  .seal{
    width:78px;height:78px;border-radius:50%;margin:0 auto 22px;
    display:grid;place-items:center;text-align:center;
    font-family:var(--font-data);font-size:9px;letter-spacing:.12em;line-height:1.3;
    color:#35204a;text-transform:uppercase;
    background:linear-gradient(100deg,#ffd0bd,#ffc0dc,#d8ccff,#c9f0e0,#ffd0bd);
    background-size:260% 100%;animation:shimmer 7s linear infinite;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.7);
  }
  @keyframes shimmer{to{background-position:260% 0}}
  h1{
    font-family:var(--font-display);font-weight:800;font-size:clamp(30px,8vw,42px);
    line-height:.98;letter-spacing:-.03em;margin:0 0 12px;text-wrap:balance
  }
  p{color:var(--ink-soft);margin:0 0 14px}
  .mrz{
    font-family:var(--font-data);font-size:10.5px;letter-spacing:.06em;line-height:1.8;
    color:var(--ink-faint);word-break:break-all;text-transform:uppercase;
    border-top:1px dashed var(--line);padding-top:14px;margin:24px 0 0;text-align:left
  }
  a{color:var(--pop)}
  a:focus-visible{outline:2px solid var(--pop);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}
  }
</style>
</head>
<body>
<main>
  <div class="doc">
    <div class="seal" aria-hidden="true">Stamped<br />O4W</div>
    <h1>You&rsquo;re on the list.</h1>
    <p>
      We&rsquo;ll email you the moment registration opens. Fifteen teams, first come
      &mdash; so keep an eye out.
    </p>
    <p><a href="/">Back to the front page</a></p>
    <p class="mrz">
      STATUS&lt;&lt;REGISTERED&lt;INTEREST&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;<br />
      NEXT&lt;&lt;WATCH&lt;YOUR&lt;INBOX&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;&lt;
    </p>
  </div>
</main>
</body>
</html>
